name: Deploy Portfolio to S3

on:
  push:

jobs:
  s3ls:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: "ap-northeast-1"
          role-to-assume: "arn:aws:iam::166855511114:role/oidc-githubactions-s3-portfolio-role"

      - run: aws s3 ls s3://maruko.site
